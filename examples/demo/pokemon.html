<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pokémon Velmora — TeEngine</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0d1220;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        outline: none;
      }

      #back {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 2;
        color: #c9d1d9;
        font-family: system-ui, sans-serif;
        font-size: 13px;
        text-decoration: none;
        padding: 6px 12px;
        background: rgba(13, 18, 32, 0.75);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }

      #back:hover {
        background: rgba(27, 40, 56, 0.9);
        color: #66c0f4;
      }

      #hud {
        position: fixed;
        bottom: 10px;
        right: 14px;
        color: #6a7385;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 11px;
        pointer-events: none;
        z-index: 1;
      }

      #fallback {
        display: none;
        color: #f0f6fc;
        font-family: system-ui, sans-serif;
        padding: 2rem;
        max-width: 40rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <a id="back" href="index.html">← Store</a>
    <div id="hud">Arrows/WASD move · Z confirm · X cancel · Enter menu</div>
    <canvas id="canvas" tabindex="0"></canvas>
    <div id="fallback">
      <h1>Graphics unavailable</h1>
      <p>This game needs WebGPU (Chrome/Edge 113+) or a Canvas2D-capable browser.</p>
    </div>
    <script type="module" src="/src/pokemon/main.ts"></script>
  </body>
</html>
